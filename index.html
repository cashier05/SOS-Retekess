<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Panggil Alarm - Kasir</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #f1c40f;
            --bg: #ecf0f1;
            --text: #333;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

        header { background-color: var(--primary); color: white; padding: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.2rem; }
        header p { font-size: 0.8rem; opacity: 0.8; margin-top: 4px; }

        .container { padding: 15px; max-width: 800px; margin: 0 auto; }

        .section-title { font-size: 0.9rem; font-weight: bold; color: var(--primary); margin: 15px 0 10px 5px; text-transform: uppercase; letter-spacing: 1px; }

        .pos-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 600px) { .pos-grid { grid-template-columns: repeat(3, 1fr); } }

        .pos-card { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.1s, box-shadow 0.2s; border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-height: 130px; }
        .pos-card:active { transform: scale(0.97); }
        .pos-card.selected { border-color: var(--accent); background-color: #fffdf2; }

        .pos-name { font-size: 1.3rem; font-weight: bold; color: var(--primary); margin-bottom: 2px; }
        .pos-type { font-size: 0.65rem; color: #7f8c8d; text-transform: uppercase; margin-bottom: 8px; }

        .btn-panggil { background-color: #bdc3c7; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 0.75rem; width: 100%; text-transform: uppercase; cursor: pointer; }
        .pos-card.selected .btn-panggil { background-color: var(--success); }

        /* Status Calling */
        .pos-card.calling { animation: pulseDanger 1s infinite; border-color: var(--danger); background-color: #fff5f5; }
        .pos-card.calling .btn-panggil { display: none; }
        
        .btn-batal-pos { background-color: #7f8c8d; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 0.75rem; width: 100%; text-transform: uppercase; cursor: pointer; display: none; }
        .pos-card.calling .btn-batal-pos { display: block; background-color: var(--danger); }

        @keyframes pulseDanger { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: opacity 0.3s; padding: 20px; }
        .modal-overlay.open { display: flex; opacity: 1; }
        .modal { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: translateY(20px); transition: transform 0.3s; }
        .modal-overlay.open .modal { transform: translateY(0); }
        .modal h2 { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; }
        .modal p { font-size: 1rem; color: #7f8c8d; margin-bottom: 25px; }
        
        .modal-buttons { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-cancel { background-color: #bdc3c7; color: var(--primary); }
        .btn-confirm { background-color: var(--success); color: white; }

        /* Notification */
        #notif { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 25px; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-weight: bold; display: none; z-index: 2000; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <h1>Menu Kasir</h1>
    <p>Sistem Panggil Alarm (Supervisor)</p>
</header>

<div class="container">
    <div class="section-title">Pos Kassa Utama</div>
    <div class="pos-grid" id="kassaGrid"></div>

    <div class="section-title">Pos Counter</div>
    <div class="pos-grid" id="counterGrid"></div>
</div>

<div id="notif">Notifikasi</div>

<!-- Modal Konfirmasi -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2>Konfirmasi</h2>
        <p>Apakah Anda yakin ingin memanggil Supervisor ke <strong id="modalPosName">Pos X</strong>?</p>
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeModal()">Batal</button>
            <button class="btn btn-confirm" id="btnConfirmCall">KIRIM ALARM</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyB8qkD7b6zRqVXP0q8TTsstCUGfNkknEuY",
      authDomain: "panggil-alam-kasir.firebaseapp.com",
      databaseURL: "https://panggil-alam-kasir-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "panggil-alam-kasir",
      storageBucket: "panggil-alam-kasir.firebasestorage.app",
      messagingSenderId: "189819600293",
      appId: "1:189819600293:web:db93782d4094ae54a77c4c",
      measurementId: "G-Z0VBG64G95"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const daftarPos = {
        kassa: [
            { id: 'kassa1', name: 'Kassa 1' }, { id: 'kassa2', name: 'Kassa 2' },
            { id: 'kassa3', name: 'Kassa 3' }, { id: 'kassa4', name: 'Kassa 4' },
            { id: 'kassa5', name: 'Kassa 5' }, { id: 'kassa6', name: 'Kassa 6' },
            { id: 'kassa7', name: 'Kassa 7' }, { id: 'kassa8', name: 'Kassa 8' },
            { id: 'kassa9', name: 'Kassa 9' }, { id: 'kassa10', name: 'Kassa 10' },
            { id: 'kassa11', name: 'Kassa 11' }
        ],
        counter: [
            { id: 'sushi', name: 'Sushi' }, { id: 'bakery', name: 'Bakery' },
            { id: 'coffee', name: 'Coffee' }, { id: 'pasar_fresh', name: 'Pasar Fresh' },
            { id: 'toko', name: 'Toko' }, { id: 'bazaar', name: 'Bazaar' }
        ]
    };

    let currentSelectedPos = null;
    let activeCallsMap = {};

    const modal = document.getElementById('modalOverlay');
    const modalPosName = document.getElementById('modalPosName');
    const btnConfirmCall = document.getElementById('btnConfirmCall');
    const notif = document.getElementById('notif');

    function createGrid(type) {
        const grid = document.getElementById(type + 'Grid');
        daftarPos[type].forEach(pos => {
            const card = document.createElement('div');
            card.className = 'pos-card';
            card.id = `card-${pos.id}`;
            
            card.innerHTML = `
                <div>
                    <div class="pos-name">${pos.name}</div>
                    <div class="pos-type">${type === 'kassa' ? 'Kassa Utama' : 'Counter Area'}</div>
                </div>
                <div>
                    <button class="btn-panggil" id="btn-panggil-${pos.id}" onclick="promptCall('${pos.id}', '${pos.name}')">Panggil</button>
                    <button class="btn-batal-pos" id="btn-batal-${pos.id}" onclick="cancelCallFromKasir('${pos.id}')">Batalkan</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function promptCall(posId, posName) {
        currentSelectedPos = { id: posId, name: posName };
        modalPosName.innerText = posName;
        modal.classList.add('open');
    }

    function closeModal() {
        modal.classList.remove('open');
        currentSelectedPos = null;
    }

    btnConfirmCall.onclick = function() {
        if (!currentSelectedPos) return;
        
        const callData = {
            posId: currentSelectedPos.id,
            posName: currentSelectedPos.name,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            status: 'active'
        };

        database.ref('panggilan').push(callData)
            .then(() => {
                showNotification("Panggilan Terkirim ke Supervisor!");
                closeModal();
            })
            .catch((error) => {
                alert('Gagal mengirim panggilan. Periksa koneksi.');
                console.error(error);
                closeModal();
            });
    };

    function cancelCallFromKasir(posId) {
        const firebaseKey = activeCallsMap[posId];
        if (firebaseKey) {
            database.ref(`panggilan/${firebaseKey}`).update({
                status: 'cancelled',
                cancelledAt: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                showNotification("Panggilan dibatalkan.");
            });
        }
    }

    function showNotification(text) {
        notif.innerText = text;
        notif.style.display = 'block';
        setTimeout(() => notif.style.display = 'none', 3000);
    }

    function listenToCallStatus() {
        database.ref('panggilan').on('value', (snapshot) => {
            document.querySelectorAll('.pos-card').forEach(card => card.classList.remove('calling'));
            activeCallsMap = {};

            snapshot.forEach((childSnapshot) => {
                const key = childSnapshot.key;
                const call = childSnapshot.val();

                if (call.status === 'active') {
                    activeCallsMap[call.posId] = key;
                    const card = document.getElementById(`card-${call.posId}`);
                    if (card) {
                        card.classList.add('calling');
                    }
                }
            });
        });
    }

    createGrid('kassa');
    createGrid('counter');
    listenToCallStatus();
</script>

</body>
</html>
